name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p public
          cp index.html styles.css script.js leizi.jpg.jpeg leizi-atendimento.jpg leizi-cuidado.jpg servico-cuidados-faciais.jpg servico-massagem-corporal-maos.jpg servico-massagem-com-oleo.jpg servico-auriculoterapia.jpg servico-depilacao-cera.jpg avaliacao-*.jpg denise-terra.jpg raquel-campos.jpg rafaela-cavalcante.jpg public/
          touch public/.nojekyll
          test -s public/index.html
          test -s public/styles.css
          test -s public/script.js
          test -s public/leizi.jpg.jpeg
          test -s public/leizi-atendimento.jpg
          test -s public/leizi-cuidado.jpg
          test -s public/servico-cuidados-faciais.jpg
          test -s public/servico-massagem-corporal-maos.jpg
          test -s public/servico-massagem-com-oleo.jpg
          test -s public/servico-auriculoterapia.jpg
          test -s public/servico-depilacao-cera.jpg
          test -s public/avaliacao-denise-terra.jpg
          test -s public/avaliacao-raquel-campos.jpg
          test -s public/avaliacao-rafaela-cavalcante.jpg
          test -s public/denise-terra.jpg
          test -s public/raquel-campos.jpg
          test -s public/rafaela-cavalcante.jpg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
